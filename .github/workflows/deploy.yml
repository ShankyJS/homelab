name: Deploy Homelab

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: "Playbook to run"
        required: true
        default: "site.yml"
        type: choice
        options:
          - site.yml
          - k3s.yml
          - flux.yml
          - tailscale.yml
          - diagnose.yml
      extra_args:
        description: "Extra ansible-playbook arguments (e.g. --tags common)"
        required: false
        default: ""
        type: string
      k3s_clean:
        description: "Destroy and reinstall k3s (only applies to k3s.yml / site.yml)"
        required: false
        default: false
        type: boolean

env:
  ANSIBLE_IMAGE: homelab-ansible

jobs:
  deploy:
    runs-on: jetson-arm64
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          BECOME_PASS: op://homelab/jetson_root_password/password
          GITHUB_TOKEN: op://homelab/flux_cd_token_github/credential
          TAILSCALE_AUTHKEY: op://homelab/jetson_tailscale_auth_key/password
          OP_SA_TOKEN: op://homelab/1password_sa_jetson_k3s/credential

      - name: Build Ansible image
        run: docker build -t "${ANSIBLE_IMAGE}" .

      - name: Determine playbook
        id: playbook
        run: |
          PLAYBOOK="${{ inputs.playbook }}"
          CLEAN="${{ inputs.k3s_clean }}"
          EXTRA="${{ inputs.extra_args }}"

          # Add clean install flag if requested
          if [ "${CLEAN}" = "true" ] && echo "${PLAYBOOK}" | grep -qE '^(site|k3s)\.yml$'; then
            EXTRA="-e k3s_clean_install=true ${EXTRA}"
          fi

          echo "playbook=${PLAYBOOK}" >> "$GITHUB_OUTPUT"
          echo "extra=${EXTRA}" >> "$GITHUB_OUTPUT"
          echo "::notice::Playbook: ${PLAYBOOK}, Extra: ${EXTRA}"

      - name: Run Ansible playbook
        env:
          BECOME_PASS: ${{ env.BECOME_PASS }}
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          TAILSCALE_AUTHKEY: ${{ env.TAILSCALE_AUTHKEY }}
          OP_SA_TOKEN: ${{ env.OP_SA_TOKEN }}
        run: |
          docker run --rm -i \
            -v "${GITHUB_WORKSPACE}/ansible:/ansible" \
            -v "${GITHUB_WORKSPACE}/kubeconfig:/kubeconfig" \
            -e ANSIBLE_FORCE_COLOR=1 \
            -e BECOME_PASS \
            -e GITHUB_TOKEN \
            -e TAILSCALE_AUTHKEY \
            -e OP_SA_TOKEN \
            "${ANSIBLE_IMAGE}" \
            ${{ steps.playbook.outputs.playbook }} \
            ${{ steps.playbook.outputs.extra }}
