---
# Layer 2: Cluster secrets — ClusterSecretStore + ExternalSecrets
# Depends on infrastructure so ESO CRDs exist before these CRs are applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/cluster-secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
