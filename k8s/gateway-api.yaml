---
# Layer 0: Gateway API CRDs — must exist before Traefik and k8s-gateway.
#
# k8s_gateway v0.4.0 requires v1alpha2 versions of GRPCRoute and TLSRoute.
# The v1.1.0 experimental channel has both v1 and v1alpha2.
# Traefik's built-in CRD installation is skipped to avoid conflicts.
#
# TODO: Remove once k8s_gateway supports Gateway API v1 natively.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    tag: v1.1.0
  ignore: |
    /*
    !/config/crd/experimental/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: flux-system
spec:
  interval: 24h
  prune: false
  sourceRef:
    kind: GitRepository
    name: gateway-api
  path: ./config/crd/experimental
