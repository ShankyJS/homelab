---
# Layer 1: Infrastructure — Traefik, k8s-gateway, ESO operator, ARC controller, ARC runners, Zot
# Depends on cert-manager and Gateway API CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/infrastructure
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: namespaces
    - name: cert-manager
    - name: gateway-api-crds
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cloudnative-pg
      namespace: cnpg-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: eso
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: paperclip-operator
      namespace: paperclip-operator-system
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: traefik
      namespace: traefik
