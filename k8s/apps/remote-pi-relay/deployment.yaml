---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remote-pi-relay
  namespace: remote-pi-relay
  labels:
    app.kubernetes.io/name: remote-pi-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: remote-pi-relay
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: remote-pi-relay
    spec:
      containers:
        - name: remote-pi-relay
          image: jacobmoura7/remote-pi-relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remote-pi-relay-data
