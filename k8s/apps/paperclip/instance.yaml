---
apiVersion: paperclip.inc/v1alpha1
kind: Instance
metadata:
  name: paperclip
  namespace: paperclip
spec:
  image:
    tag: latest
  deployment:
    mode: authenticated
    exposure: public
    publicURL: https://paperclip.int.shankyjs.com
    allowedHostnames:
      - paperclip.int.shankyjs.com
  database:
    mode: external
    externalURLSecretRef:
      name: paperclip-db-app
      key: uri
  auth:
    secretRef:
      name: paperclip-auth
      key: BETTER_AUTH_SECRET
  storage:
    persistence:
      enabled: true
      size: 10Gi
  initContainers:
    - name: configure-public-auth
      image: node:22-alpine
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ec
      args:
        - |
          CONFIG=/paperclip/instances/default/config.json
          test -f "$CONFIG"
          node - "$CONFIG" <<'JS'
          const fs = require("fs");
          const configPath = process.argv[2];
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));

          config.server = {
            ...config.server,
            deploymentMode: "authenticated",
            exposure: "public",
            bind: "custom",
            customBindHost: "0.0.0.0",
            host: "0.0.0.0",
            port: 3100,
            allowedHostnames: [
              "localhost",
              "127.0.0.1",
              "paperclip",
              "paperclip.paperclip",
              "paperclip.paperclip.svc",
              "paperclip.paperclip.svc.cluster.local",
              "paperclip.int.shankyjs.com"
            ],
            serveUi: true
          };

          config.auth = {
            ...config.auth,
            baseUrlMode: "explicit",
            publicBaseUrl: "https://paperclip.int.shankyjs.com"
          };

          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          JS
      volumeMounts:
        - name: paperclip-data
          mountPath: /paperclip
  networking:
    service:
      type: ClusterIP
      port: 3100
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - paperclip.int.shankyjs.com
      tls:
        - secretName: wildcard-tls
          hosts:
            - paperclip.int.shankyjs.com
