---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperclip-db
  namespace: paperclip
spec:
  instances: 1
  bootstrap:
    initdb:
      database: paperclip
      owner: paperclip
  storage:
    size: 20Gi
    storageClass: paperclip-postgres-hostpath
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
