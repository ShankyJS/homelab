---
# ExternalSecret that fetches the CA keypair from 1Password.
# Creates a kubernetes.io/tls Secret used by cert-manager's ClusterIssuer.
#
# The 1Password item "ca_key_int_shankyjs_com" must have two fields:
#   - credential: the PEM-encoded CA private key
#   - certificate: the PEM-encoded CA public certificate
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ca-key-secret
  namespace: cert-manager
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ca-key-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.key: "{{ .ca_key }}"
        tls.crt: "{{ .ca_crt }}"
  data:
    - secretKey: ca_key
      remoteRef:
        key: ca_key_int_shankyjs_com/credential
    - secretKey: ca_crt
      remoteRef:
        key: ca_key_int_shankyjs_com/certificate
