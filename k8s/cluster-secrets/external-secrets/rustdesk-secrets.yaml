---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustdesk-server-keys
  namespace: rustdesk
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: rustdesk-server-keys
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: rustdesk_server_keys/id_ed25519
    - secretKey: id_ed25519.pub
      remoteRef:
        key: rustdesk_server_keys/id_ed25519_pub
