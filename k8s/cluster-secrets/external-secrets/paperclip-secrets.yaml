---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperclip-auth
  namespace: paperclip
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: paperclip-auth
    creationPolicy: Owner
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: paperclip_auth/better_auth_secret
