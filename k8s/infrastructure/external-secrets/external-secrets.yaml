---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-secret
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: arc-github-secret
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: flux_cd_token_github/credential
