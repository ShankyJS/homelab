---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
      version: ">=0.9.0"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    githubConfigUrl: "https://github.com/ShankyJS/homelab"
    githubConfigSecret: arc-github-secret
    runnerScaleSetName: "jetson-arm64"
    maxRunners: 3
    minRunners: 0
    template:
      spec:
        volumes:
          - name: homelab-ca-cert
            configMap:
              name: homelab-ca-cert
          - name: docker-certs
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
          - name: work
            emptyDir: {}
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/actions/actions-runner:latest
            command:
              - cp
            args:
              - -r
              - /home/runner/externals/.
              - /home/runner/tmpDir/
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          # Copy CA cert into a shared volume that the DinD daemon can access.
          # The DinD sidecar auto-generated by ARC mounts the work volume at /home/runner.
          # We copy the cert to the Docker cert directory structure.
          - name: setup-ca-cert
            image: busybox:latest
            command:
              - sh
              - -c
              - |
                # Create Docker registry cert directory
                mkdir -p /docker-certs/zot.int.shankyjs.com
                cp /ca-cert/ca.crt /docker-certs/zot.int.shankyjs.com/ca.crt
            volumeMounts:
              - name: homelab-ca-cert
                mountPath: /ca-cert
                readOnly: true
              - name: docker-certs
                mountPath: /docker-certs
          - name: dind
            image: docker:dind
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            restartPolicy: Always
            startupProbe:
              exec:
                command:
                  - docker
                  - info
              failureThreshold: 24
              initialDelaySeconds: 0
              periodSeconds: 5
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
              - name: docker-certs
                mountPath: /etc/docker/certs.d
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command:
              - /home/runner/run.sh
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        restartPolicy: Never
