---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-runner-set
  namespace: arc-runners
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: arc-systems
      version: ">=0.9.0"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    githubConfigUrl: "https://github.com/ShankyJS/homelab"
    githubConfigSecret: arc-github-secret
    runnerScaleSetName: "jetson-arm64"
    maxRunners: 3
    minRunners: 0
    containerMode:
      type: dind
      # Extra Docker daemon arguments to trust our self-signed CA.
      # The DinD sidecar uses these as command-line flags.
      kubernetesModeWorkVolumeClaim:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "local-path"
        resources:
          requests:
            storage: 1Gi
    template:
      spec:
        volumes:
          - name: homelab-ca-cert
            configMap:
              name: homelab-ca-cert
        initContainers:
          # Copy CA cert into a shared volume that the DinD daemon can access.
          # The DinD sidecar auto-generated by ARC mounts the work volume at /home/runner.
          # We copy the cert to the Docker cert directory structure.
          - name: setup-ca-cert
            image: busybox:latest
            command:
              - sh
              - -c
              - |
                # Create Docker registry cert directory
                mkdir -p /home/runner/.docker/certs.d/zot.int.shankyjs.com
                cp /ca-cert/ca.crt /home/runner/.docker/certs.d/zot.int.shankyjs.com/ca.crt
            volumeMounts:
              - name: homelab-ca-cert
                mountPath: /ca-cert
                readOnly: true
              - name: work
                mountPath: /home/runner
