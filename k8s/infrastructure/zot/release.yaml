---
apiVersion: v1
kind: Namespace
metadata:
  name: zot
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zot
  namespace: zot
spec:
  interval: 1h
  url: http://zotregistry.dev/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 30m
  chart:
    spec:
      chart: zot
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: zot
      version: ">=0.1.100"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/project-zot/zot-linux-arm64
      tag: v2.1.2
    service:
      type: ClusterIP
      port: 5000
    persistence:
      enabled: true
      size: 10Gi
