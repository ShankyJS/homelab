---
apiVersion: v1
kind: Namespace
metadata:
  name: zot
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: zot
  namespace: zot
spec:
  interval: 1h
  url: http://zotregistry.dev/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 30m
  chart:
    spec:
      chart: zot
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: zot
      version: ">=0.1.100"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: ghcr.io/project-zot/zot-linux-arm64
      tag: v2.1.15
    service:
      type: ClusterIP
      port: 5000
    httpGet:
      scheme: HTTP
      port: 5000
    # Give Zot more time to start (default failureThreshold=3 is too aggressive)
    startupProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 10
    persistence: true
    pvc:
      create: true
      accessModes: ["ReadWriteOnce"]
      storage: 10Gi
