---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: paperclip-operator
  namespace: paperclip-operator-system
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/paperclipinc/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperclip-operator
  namespace: paperclip-operator-system
spec:
  interval: 30m
  chart:
    spec:
      chart: paperclip-operator
      sourceRef:
        kind: HelmRepository
        name: paperclip-operator
        namespace: paperclip-operator-system
      version: ">=0.11.1"
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
