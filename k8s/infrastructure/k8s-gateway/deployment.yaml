---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: k8s-gateway
  namespace: k8s-gateway
spec:
  interval: 1h
  url: https://ori-edge.github.io/k8s_gateway
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
  namespace: k8s-gateway
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-gateway
      sourceRef:
        kind: HelmRepository
        name: k8s-gateway
        namespace: k8s-gateway
      version: ">=2.0.0"
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    domain: int.shankyjs.com
    # Port 53 on the host — systemd-resolved stub listener is disabled
    # via Ansible (common role) so this port is free.
    service:
      type: ClusterIP
      port: 53
      externalIPs:
        - 100.88.193.63
    tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    watchedResources:
      - Ingress
      - IngressRoute
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: k8s-gateway
            patch: |-
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
              - op: add
                path: /spec/template/spec/hostNetwork
                value: true
              - op: add
                path: /spec/template/spec/dnsPolicy
                value: ClusterFirstWithHostNet
              - op: replace
                path: /spec/template/spec/containers/0/securityContext
                value:
                  runAsUser: 0
                  capabilities:
                    add: ["NET_BIND_SERVICE"]
              - op: replace
                path: /spec/template/spec/containers/0/ports/0/containerPort
                value: 53
              - op: replace
                path: /spec/template/spec/containers/0/ports/0/hostPort
                value: 53
          # Add Traefik CRDs to RBAC (chart only includes standard Ingress)
          - target:
              kind: ClusterRole
              name: k8s-gateway
            patch: |-
              - op: add
                path: /rules/-
                value:
                  apiGroups: ["traefik.io", "traefik.containo.us"]
                  resources: ["ingressroutes", "ingressroutetcps", "ingressrouteudps"]
                  verbs: ["list", "watch"]
          # Rewrite Corefile to listen on 53 (chart hardcodes 1053)
          - target:
              kind: ConfigMap
              name: k8s-gateway
            patch: |-
              - op: replace
                path: /data/Corefile
                value: |
                  .:53 {
                    hosts {
                      100.88.193.63 zot.int.shankyjs.com
                      fallthrough
                    }
                    k8s_gateway int.shankyjs.com {
                      apex k8s-gateway.k8s-gateway
                      ttl 300
                      resources Ingress IngressRoute
                    }
                    log
                    errors
                    health {
                      lameduck 5s
                    }
                    ready
                    prometheus 0.0.0.0:9153
                    forward . /etc/resolv.conf
                    loop
                    reload
                    loadbalance
                  }
