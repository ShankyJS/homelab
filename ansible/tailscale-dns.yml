---
# Tailscale split DNS playbook
# Configures Tailscale to resolve *.int.shankyjs.com via the Jetson
# Usage: make deploy-tailscale-dns

- name: Configure Tailscale split DNS
  hosts: servers
  become: true
  vars:
    ansible_become_pass: "{{ lookup('env', 'BECOME_PASS') }}"
    ansible_ssh_pass: "{{ lookup('env', 'BECOME_PASS') }}"
    tailscale_api_token: "{{ lookup('env', 'TAILSCALE_API_TOKEN') }}"
  roles:
    - tailscale-dns
