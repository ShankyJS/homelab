---
- name: Build tailscale command arguments
  ansible.builtin.set_fact:
    tailscale_up_args: >-
      --authkey={{ tailscale_authkey }}
      --operator={{ tailscale_operator }}
      --advertise-exit-node={{ tailscale_exit_node | bool | lower }}
      --advertise-routes={{ tailscale_advertise_routes | join(',') }}
      --accept-routes={{ tailscale_accept_routes | bool | lower }}
      --accept-dns={{ tailscale_accept_dns | bool | lower }}
      --reset
    tailscale_set_args: >-
      --operator={{ tailscale_operator }}
      --advertise-exit-node={{ tailscale_exit_node | bool | lower }}
      --advertise-routes={{ tailscale_advertise_routes | join(',') }}
      --accept-routes={{ tailscale_accept_routes | bool | lower }}
      --accept-dns={{ tailscale_accept_dns | bool | lower }}

- name: Check current Tailscale status
  ansible.builtin.command:
    cmd: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Bring up Tailscale
  ansible.builtin.command:
    cmd: "tailscale up {{ tailscale_up_args }}"
  register: tailscale_up_result
  changed_when: "'Success' in tailscale_up_result.stderr or tailscale_up_result.rc == 0"
  when: >
    tailscale_status.rc != 0 or
    (tailscale_status.stdout | from_json).BackendState != 'Running'
  notify: Verify tailscale status

- name: Reconcile Tailscale preferences
  ansible.builtin.command:
    cmd: "tailscale set {{ tailscale_set_args }}"
  changed_when: false
