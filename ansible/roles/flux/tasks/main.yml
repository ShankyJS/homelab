---
- name: Check if flux CLI is installed
  ansible.builtin.command:
    cmd: flux version --client
  register: flux_version_check
  changed_when: false
  failed_when: false

- name: Install flux CLI
  when: flux_version_check.rc != 0
  block:
    - name: Download flux install script
      ansible.builtin.get_url:
        url: https://fluxcd.io/install.sh
        dest: /tmp/flux-install.sh
        mode: "0755"

    - name: Run flux install script
      ansible.builtin.command:
        cmd: /tmp/flux-install.sh
      environment:
        FLUX_VERSION: "{{ flux_version }}"

    - name: Clean up flux install script
      ansible.builtin.file:
        path: /tmp/flux-install.sh
        state: absent

- name: Check if flux is already bootstrapped
  ansible.builtin.command:
    cmd: k3s kubectl get namespace {{ flux_namespace }}
  register: flux_ns_check
  changed_when: false
  failed_when: false

- name: Bootstrap flux
  when: flux_ns_check.rc != 0
  ansible.builtin.command:
    cmd: >-
      flux bootstrap github
      --owner={{ flux_github_owner }}
      --repository={{ flux_github_repo }}
      --branch={{ flux_github_branch }}
      --path={{ flux_path }}
      --personal
      --token-auth
  environment:
    GITHUB_TOKEN: "{{ github_token }}"
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

# --- 1Password Service Account token (seed secret for External Secrets Operator) ---
- name: Create external-secrets namespace
  ansible.builtin.command:
    cmd: k3s kubectl create namespace {{ eso_namespace }}
  register: eso_ns_result
  changed_when: eso_ns_result.rc == 0
  failed_when: eso_ns_result.rc != 0 and 'already exists' not in eso_ns_result.stderr

- name: Create 1Password SA token seed secret
  ansible.builtin.command:
    cmd: >-
      k3s kubectl create secret generic {{ eso_op_secret_name }}
      --namespace={{ eso_namespace }}
      --from-literal=token={{ op_sa_token }}
      --dry-run=client -o yaml
  register: op_seed_secret_manifest
  changed_when: false
  no_log: true

- name: Apply 1Password SA token seed secret
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ op_seed_secret_manifest.stdout }}"
  register: op_seed_secret_apply
  changed_when: "'configured' in op_seed_secret_apply.stdout or 'created' in op_seed_secret_apply.stdout"
  no_log: true
