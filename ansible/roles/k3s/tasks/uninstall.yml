---
- name: Check if k3s uninstall script exists
  ansible.builtin.stat:
    path: /usr/local/bin/k3s-uninstall.sh
  register: k3s_uninstall_script

- name: Stop k3s service
  ansible.builtin.systemd:
    name: k3s
    state: stopped
  when: k3s_uninstall_script.stat.exists
  ignore_errors: true

- name: Run k3s uninstall script
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s-uninstall.sh
  when: k3s_uninstall_script.stat.exists
  register: k3s_uninstall_result
  changed_when: k3s_uninstall_result.rc == 0

- name: Clean up k3s data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/rancher/k3s
    - /etc/rancher/k3s
  when: k3s_uninstall_script.stat.exists

- name: Wait for k3s cleanup
  ansible.builtin.pause:
    seconds: 5
  when: k3s_uninstall_script.stat.exists
