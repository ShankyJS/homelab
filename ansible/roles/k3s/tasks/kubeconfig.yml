---
- name: Create local kubeconfig directory
  ansible.builtin.file:
    path: "{{ k3s_local_kubeconfig_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Read kubeconfig from server
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw

- name: Write kubeconfig locally
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig_raw.content | b64decode | regex_replace('127\\.0\\.0\\.1', ansible_host) }}"
    dest: "{{ k3s_local_kubeconfig_dir }}/{{ inventory_hostname }}.yaml"
    mode: "0600"
  delegate_to: localhost
  become: false
