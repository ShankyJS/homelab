---
# Syncthing role defaults

# APT repository
syncthing_apt_key_url: "https://syncthing.net/release-key.gpg"
syncthing_apt_repo: "deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable-v2"

# Syncthing runs as a user-level systemd service
# Set this to the user that should run syncthing
syncthing_user: "{{ ansible_user }}"

# GUI listen address (default: localhost only)
syncthing_gui_address: "0.0.0.0:8384"

# Synced folder paths that need .stignore files
# Each entry is an absolute path to a synced folder root
syncthing_stignore_folders:
  - "/home/{{ syncthing_user }}/os"

# Patterns to ignore across all synced folders
syncthing_stignore_patterns:
  # Terraform
  - ".terraform"
  # Node.js
  - "node_modules"
  # Python
  - "__pycache__"
  - ".venv"
  - "*.pyc"
  # Rust
  - "target"
  # Go
  - "vendor"
  # Build artifacts
  - ".build"
  - "dist"
  # IDE / OS junk
  - ".DS_Store"
  - "Thumbs.db"
