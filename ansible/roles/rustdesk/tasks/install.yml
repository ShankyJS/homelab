---
- name: Check if RustDesk is already installed
  ansible.builtin.command:
    cmd: dpkg-query -W -f='${Version}' rustdesk
  register: rustdesk_installed
  changed_when: false
  failed_when: false

- name: Download RustDesk deb package
  ansible.builtin.get_url:
    url: "{{ rustdesk_deb_url }}"
    dest: "/tmp/rustdesk-{{ rustdesk_version }}-aarch64.deb"
    mode: "0644"
  when: rustdesk_installed.stdout != rustdesk_version

- name: Install RustDesk deb package
  ansible.builtin.apt:
    deb: "/tmp/rustdesk-{{ rustdesk_version }}-aarch64.deb"
    state: present
  when: rustdesk_installed.stdout != rustdesk_version

- name: Clean up downloaded deb
  ansible.builtin.file:
    path: "/tmp/rustdesk-{{ rustdesk_version }}-aarch64.deb"
    state: absent
