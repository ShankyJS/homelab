---
- name: Install common packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ common_kernel_modules }}"
  ignore_errors: true

- name: Persist kernel modules across reboots
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/homelab.conf
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop: "{{ common_kernel_modules }}"

- name: Apply sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-homelab.conf
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"
  when: timezone is defined
