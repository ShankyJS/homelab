---
# k3s playbook (includes kernel module compilation + k3s install)
# Usage: make deploy-k3s
# For clean reinstall: make deploy-k3s-clean

- name: Install and configure k3s
  hosts: servers
  become: true
  vars:
    ansible_become_pass: "{{ lookup('env', 'BECOME_PASS') }}"
  roles:
    - common
    - kernel-modules
    - k3s
